<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="618" viewBox="0 0 1500 618"><rect width="100%" height="100%" fill="#ffffff"/><text x="42" y="46" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#000000">Selección del segmento y cálculo de FFT · procesamiento.py</text><line x1="42" y1="58" x2="1458" y2="58" stroke="#000000" stroke-width="1"/><text x="42" y="108" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">def seleccionar_segmento(x):</text><text x="42" y="140" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    cantidad = int(cfg.SAMPLE_RATE * cfg.DURACION_SEGMENTO)</text><text x="42" y="172" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    if len(x) &lt;= cantidad:</text><text x="42" y="204" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">        return x</text><text x="42" y="236" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    acumulada = np.concatenate(([0.0], np.cumsum(x ** 2)))</text><text x="42" y="268" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    paso = max(1, int(cfg.SAMPLE_RATE * 0.25))</text><text x="42" y="300" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    inicios = np.arange(0, len(x) - cantidad + 1, paso)</text><text x="42" y="332" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    inicios = np.unique(np.append(inicios, len(x) - cantidad))</text><text x="42" y="364" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    energias = acumulada[inicios + cantidad] - acumulada[inicios]</text><text x="42" y="396" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    inicio = int(inicios[np.argmax(energias)])</text><text x="42" y="428" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    return x[inicio:inicio + cantidad]</text><text x="42" y="460" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">&#160;</text><text x="42" y="492" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">def analizar(audio):</text><text x="42" y="524" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    x = seleccionar_segmento(preprocesar(audio))</text><text x="42" y="556" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    bloques = x[:len(x) // cfg.N_FFT * cfg.N_FFT].reshape(-1, cfg.N_FFT)</text><text x="42" y="588" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    espectros = np.fft.rfft(bloques, axis=1)</text></svg>