<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="554" viewBox="0 0 1500 554"><rect width="100%" height="100%" fill="#ffffff"/><text x="42" y="46" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#000000">Entrenamiento y decisión por distancia euclidiana</text><line x1="42" y1="58" x2="1458" y2="58" stroke="#000000" stroke-width="1"/><text x="42" y="108" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000"># entrenamiento.py</text><text x="42" y="140" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">vectores = [calcular_vector_energia(cargar_audio(p))</text><text x="42" y="172" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">            for p in archivos_entrenamiento]</text><text x="42" y="204" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">referencias[clave] = np.mean(vectores, axis=0).tolist()</text><text x="42" y="236" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">&#160;</text><text x="42" y="268" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000"># procesamiento.py</text><text x="42" y="300" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">def distancia_euclidiana(vector, referencia):</text><text x="42" y="332" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    return float(np.sqrt(np.sum((np.asarray(vector) -</text><text x="42" y="364" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">                                 np.asarray(referencia)) ** 2)))</text><text x="42" y="396" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">&#160;</text><text x="42" y="428" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">def reconocer(vector, referencias):</text><text x="42" y="460" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    distancias = {clave: distancia_euclidiana(vector, referencia)</text><text x="42" y="492" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">                  for clave, referencia in referencias.items()}</text><text x="42" y="524" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    return min(distancias, key=distancias.get), distancias</text></svg>