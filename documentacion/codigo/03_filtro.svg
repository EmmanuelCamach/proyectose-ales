<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="554" viewBox="0 0 1500 554"><rect width="100%" height="100%" fill="#ffffff"/><text x="42" y="46" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#000000">Filtro Butterworth y transformación bilineal · procesamiento.py</text><line x1="42" y1="58" x2="1458" y2="58" stroke="#000000" stroke-width="1"/><text x="42" y="108" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">def coeficientes_butterworth():</text><text x="42" y="140" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    w1 = 2 * cfg.SAMPLE_RATE * np.tan(np.pi * cfg.CORTE_INFERIOR / cfg.SAMPLE_RATE)</text><text x="42" y="172" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    w2 = 2 * cfg.SAMPLE_RATE * np.tan(np.pi * cfg.CORTE_SUPERIOR / cfg.SAMPLE_RATE)</text><text x="42" y="204" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    bw = w2 - w1</text><text x="42" y="236" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    w0 = np.sqrt(w1 * w2)</text><text x="42" y="268" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    numerador = [bw ** 2, 0, 0]</text><text x="42" y="300" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    denominador = [1, np.sqrt(2) * bw, 2 * w0 ** 2 + bw ** 2,</text><text x="42" y="332" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">                   np.sqrt(2) * bw * w0 ** 2, w0 ** 4]</text><text x="42" y="364" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    return bilinear(numerador, denominador, fs=cfg.SAMPLE_RATE)</text><text x="42" y="396" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">&#160;</text><text x="42" y="428" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">def preprocesar(audio):</text><text x="42" y="460" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    x = np.asarray(audio, dtype=float).reshape(-1)</text><text x="42" y="492" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    b, a = coeficientes_butterworth()</text><text x="42" y="524" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    x = lfilter(b, a, x)</text></svg>