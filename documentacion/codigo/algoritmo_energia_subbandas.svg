<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<rect width="1500" height="760" fill="#ffffff"/>
<text x="70" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#111827">Núcleo del algoritmo: energía espectral por subbandas</text>
<text x="70" y="145" font-family="Arial,sans-serif" font-size="25" fill="#374151">1. Transformada de Fourier por bloques</text>
<rect x="65" y="175" width="1370" height="105" rx="12" fill="#f3f4f6"/>
<text x="105" y="240" font-family="Consolas,monospace" font-size="30" fill="#111827">espectros = np.fft.rfft(bloques, axis=1)</text>
<text x="70" y="345" font-family="Arial,sans-serif" font-size="25" fill="#374151">2. Energía media de cada subbanda y promedio entre bloques</text>
<rect x="65" y="375" width="1370" height="220" rx="12" fill="#f3f4f6"/>
<text x="105" y="430" font-family="Consolas,monospace" font-size="27" fill="#111827">energias = np.array([np.mean(np.abs(espectros[:, a:b]) ** 2, axis=1)</text>
<text x="105" y="475" font-family="Consolas,monospace" font-size="27" fill="#111827">                    for a, b in zip(limites[:-1], limites[1:])]).T</text>
<text x="105" y="550" font-family="Consolas,monospace" font-size="27" fill="#111827">vector = energias.mean(axis=0)</text>
<text x="70" y="655" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Equivalencia matemática</text>
<text x="70" y="710" font-family="Georgia,serif" font-size="31" fill="#111827">Eⱼ = (1/L) Σᵢ₌₁ᴸ [(1/Mⱼ) Σₖ∈Bⱼ |Xᵢ(k)|²]</text>
</svg>