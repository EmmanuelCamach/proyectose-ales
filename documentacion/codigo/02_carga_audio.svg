<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="554" viewBox="0 0 1500 554"><rect width="100%" height="100%" fill="#ffffff"/><text x="42" y="46" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#000000">Lectura y preparación del audio · procesamiento.py</text><line x1="42" y1="58" x2="1458" y2="58" stroke="#000000" stroke-width="1"/><text x="42" y="108" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">def cargar_audio(ruta):</text><text x="42" y="140" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    sr, audio = wavfile.read(ruta)</text><text x="42" y="172" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    if sr != cfg.SAMPLE_RATE:</text><text x="42" y="204" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">        raise ValueError(f'{ruta}: se requieren WAV a {cfg.SAMPLE_RATE} Hz.')</text><text x="42" y="236" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    if np.issubdtype(audio.dtype, np.integer):</text><text x="42" y="268" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">        info = np.iinfo(audio.dtype)</text><text x="42" y="300" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">        centro = (info.max + 1) / 2 if info.min == 0 else 0</text><text x="42" y="332" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">        escala = centro if info.min == 0 else -info.min</text><text x="42" y="364" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">        audio = (audio.astype(float) - centro) / escala</text><text x="42" y="396" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    else:</text><text x="42" y="428" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">        audio = audio.astype(float)</text><text x="42" y="460" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    if audio.ndim == 2:</text><text x="42" y="492" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">        audio = audio.mean(axis=1)</text><text x="42" y="524" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    return audio</text></svg>