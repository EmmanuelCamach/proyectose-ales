<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="736" viewBox="0 0 1700 736">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="44" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#111111">procesamiento.py — método analizar(audio)</text>
<text x="48" y="104" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">def analizar(audio):</text>
<text x="48" y="138" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    x = seleccionar_segmento(preprocesar(audio))</text>
<text x="48" y="172" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    if len(x) &lt; cfg.N_FFT:</text>
<text x="48" y="206" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">        x = np.pad(x, (0, cfg.N_FFT - len(x)))</text>
<text x="48" y="240" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    bloques = x[:len(x) // cfg.N_FFT * cfg.N_FFT].reshape(-1, cfg.N_FFT)</text>
<text x="48" y="274" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    # DFT X(k)=sum x(n)*exp(-j*2*pi*k*n/N), calculada mediante FFT.</text>
<text x="48" y="308" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    espectros = np.fft.rfft(bloques, axis=1)</text>
<text x="48" y="342" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    limites = cfg.FRONTERAS_SUBBANDAS</text>
<text x="48" y="376" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    if not 3 &lt;= len(limites) - 1 &lt;= 8 or any(b &lt;= a for a, b in zip(limites[:-1], limites[1:])):</text>
<text x="48" y="410" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">        raise ValueError('Defina entre 3 y 8 subbandas no vacías.')</text>
<text x="48" y="444" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    if limites[0] != 0 or limites[-1] != espectros.shape[1]:</text>
<text x="48" y="478" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">        raise ValueError('Las subbandas deben cubrir desde DC hasta Nyquist.')</text>
<text x="48" y="512" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    # Eij=(1/Mj)*sum |Xi(k)|². Primero energía, después promedio entre bloques.</text>
<text x="48" y="546" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    energias = np.array([np.mean(np.abs(espectros[:, a:b]) ** 2, axis=1)</text>
<text x="48" y="580" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">                        for a, b in zip(limites[:-1], limites[1:])]).T</text>
<text x="48" y="614" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    vector = energias.mean(axis=0)</text>
<text x="48" y="648" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    magnitud = np.abs(espectros).mean(axis=0)</text>
<text x="48" y="682" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    frecuencias = np.fft.rfftfreq(cfg.N_FFT, 1 / cfg.SAMPLE_RATE)</text>
<text x="48" y="716" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" xml:space="preserve" fill="#111111">    return vector, magnitud, frecuencias</text>
</svg>