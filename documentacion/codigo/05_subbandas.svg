<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="426" viewBox="0 0 1500 426"><rect width="100%" height="100%" fill="#ffffff"/><text x="42" y="46" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#000000">Energía espectral por subbandas · procesamiento.py</text><line x1="42" y1="58" x2="1458" y2="58" stroke="#000000" stroke-width="1"/><text x="42" y="108" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    limites = cfg.FRONTERAS_SUBBANDAS</text><text x="42" y="140" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    espectros = np.fft.rfft(bloques, axis=1)</text><text x="42" y="172" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    energias = np.array([</text><text x="42" y="204" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">        np.mean(np.abs(espectros[:, a:b]) ** 2, axis=1)</text><text x="42" y="236" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">        for a, b in zip(limites[:-1], limites[1:])</text><text x="42" y="268" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    ]).T</text><text x="42" y="300" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    vector = energias.mean(axis=0)</text><text x="42" y="332" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    magnitud = np.abs(espectros).mean(axis=0)</text><text x="42" y="364" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    frecuencias = np.fft.rfftfreq(cfg.N_FFT, 1 / cfg.SAMPLE_RATE)</text><text x="42" y="396" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21" fill="#000000">    return vector, magnitud, frecuencias</text></svg>